# Weekly dependency updates, grouped to keep the number of pull requests small (risk R-TECH-1).
# Major versions get their own pull requests, so their changelogs get read.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @astrojs/check and typescript-eslint don't support TypeScript 7 yet (#119). Remove this once
      # they do.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
