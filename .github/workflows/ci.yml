# Checks every pull request and every push to main (FND-07, design document section 11.5).
# The jobs run in parallel. E2E runs the end-to-end and accessibility tests (Playwright with axe)
# against local Supabase: at one size on pull requests, and at all three on main.
# preview.yml deploys each pull request, and deploy-staging.yml deploys main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Git hooks aren't needed in CI.
  HUSKY: 0

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Supabase listens on ports 54330 to 54339, which Linux also hands out to outgoing
      # connections. Once, an outgoing connection held 54332, so the database couldn't start.
      - name: Keep Supabase's ports free
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54330-54339
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start Postgres, apply migrations from zero, and load the local seed
        run: npx supabase db start
      - name: Run pgTAP tests
        run: npm run db:test
      - name: Check the generated types match the schema
        run: |
          npm run db:types
          if ! git diff --exit-code -- src/lib/db.types.ts; then
            echo "::error file=src/lib/db.types.ts::Generated types are out of date. Run npm run db:types and commit the result."
            exit 1
          fi
      - name: Lint database functions
        run: npx supabase db lint --local --fail-on error
      - name: Check security and performance advisors
        run: npx supabase db advisors --local --type all --level warn --fail-on warn

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A pull request runs every test at one size, Pixel 7 in Chromium, since FABA is for phones
    # first. After a merge, main runs them at all three sizes. A newer merge cancels a run that's
    # still going, so merging several pull requests in a row runs them once.
    env:
      BROWSERS: ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium webkit' }}
      PROJECTS: ${{ github.event_name == 'pull_request' && '--project=mobile' || '' }}
    steps:
      # As in the Database job.
      - name: Keep Supabase's ports free
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54330-54339
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start Supabase, apply migrations from zero, and load the local seed
        # Only the services the app uses.
        run: npx supabase start --exclude studio,postgres-meta,mailpit,imgproxy
        env:
          # Placeholders for config.toml. The tests stop before Google.
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: e2e-placeholder.apps.googleusercontent.com
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: e2e-placeholder
      - name: Write .dev.vars with the local Supabase secret key
        run: npm run setup:dev-vars
      # Chromium and WebKit need about 185 Ubuntu packages (139 MB), and the mirrors can be slow:
      # 12 seconds to 75, and once 7 minutes, which ran out the job's time. apt keeps what it
      # downloads in a cached folder, so a run only downloads packages that changed. Pull requests
      # can read main's cache. The browsers themselves come from a fast CDN in a few seconds.
      - name: Find the runner image and the Playwright version
        id: playwright
        run: |
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Restore apt's downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/apt-archives/*.deb
          key: apt-playwright-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}
          restore-keys: apt-playwright-${{ steps.playwright.outputs.image }}-
      - name: Keep apt's downloads in the cached folder
        # Not with sudo, which would make ~/.cache root's, and Playwright puts the browsers there.
        # apt's download user can't write in the runner's home folder, so apt warns that it
        # downloads as root.
        run: |
          mkdir -p "$HOME/.cache/apt-archives/partial"
          echo "Dir::Cache::Archives \"$HOME/.cache/apt-archives\";" | sudo tee /etc/apt/apt.conf.d/99cache-archives
      - name: Install the browsers
        run: npx playwright install --with-deps --only-shell $BROWSERS
      - name: Run end-to-end and accessibility tests
        run: npm run test:e2e -- $PROJECTS
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
