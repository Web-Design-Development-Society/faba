# Deploys one environment (FND-08, design document sections 11.7 and 11.8): build, then
# migrations, then the Worker, then smoke tests. Migrations always run before the Worker deploys.
# deploy-staging.yml runs it for every merge to main, and deploy-production.yml for each release,
# so production deploys exactly the way staging does, and each staging deploy rehearses it.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub Environment, and the wrangler.jsonc environment, to deploy to.
        required: true
        type: string
      ref:
        description: The commit or tag to deploy.
        required: true
        type: string
      migrate:
        description: Push migrations first. A rollback leaves them out, since the schema only moves forward.
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Git hooks aren't needed in CI.
  HUSKY: 0

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment's secrets apply from here, and so do its rules: production waits for a
    # technical owner to approve.
    environment: ${{ inputs.environment }}
    # One deploy at a time for each environment, in order. A newer one waits instead of cancelling
    # a deploy halfway.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Check the environment is set up
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          missing=()
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF \
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::The $ENVIRONMENT environment has no ${missing[*]}. See docs/runbooks/release.md."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Before the migrations, so a build that fails leaves the database as it was.
      - name: Build for ${{ inputs.environment }}
        run: npm run build
        env:
          CLOUDFLARE_ENV: ${{ inputs.environment }}
      # Supabase CLI 3 targets the local stack unless told --remote, and changes a hosted project
      # only with --yes.
      - name: Push migrations to the ${{ inputs.environment }} database
        if: inputs.migrate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase db push --remote --yes
      # Deploys what was built for this environment.
      - name: Deploy the Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke tests
        run: node scripts/smoke-test.mjs
