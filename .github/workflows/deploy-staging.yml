# Deploys main to staging on every push (FND-08, design document section 11.7), with the same steps
# as production (deploy.yml): build, migrations, the faba-staging Worker, then smoke tests. Pull
# requests already passed CI.
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      ref: ${{ github.sha }}
    secrets: inherit
