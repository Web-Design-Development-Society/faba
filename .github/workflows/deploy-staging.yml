# Deploys main to staging on every push (FND-08, design document section 11.7): migrations
# first, then the faba-staging Worker, then smoke tests. Pull requests already passed CI.
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order. A newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  # Git hooks aren't needed in CI.
  HUSKY: 0

jobs:
  deploy:
    name: Deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Push migrations to the staging database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase db push --yes
      - name: Build for staging
        run: npm run build
        env:
          CLOUDFLARE_ENV: staging
      - name: Deploy the faba-staging Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke tests
        run: node scripts/smoke-test.mjs
